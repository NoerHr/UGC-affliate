
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorKit AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body {
            background-color: #0a0a0f;
            color: #f1f1f2;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Gen Z Color System: Cyan → Lime */
        .glass-card {
            background: #111118;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.05);
        }

        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #84cc16);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #22d3ee, #a3e635);
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(6, 182, 212, 0.3);
        }
        .btn-primary:active {
            transform: translateY(0);
        }

        /* Gradient text utility */
        .gradient-text {
            background: linear-gradient(135deg, #06b6d4, #84cc16);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Animated Border Effect - Cyan/Lime */
        @keyframes gradient-xy {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .animated-gradient-border {
            position: relative;
            z-index: 0;
            overflow: hidden;
        }
        .animated-gradient-border::before {
            content: '';
            position: absolute;
            z-index: -1;
            inset: -4px;
            background: linear-gradient(45deg, #06b6d4, #84cc16, #22d3ee, #10b981);
            background-size: 300%;
            animation: gradient-xy 3s ease infinite;
            border-radius: inherit;
        }
        .animated-gradient-border::after {
            content: '';
            position: absolute;
            z-index: -1;
            inset: 2px;
            background: inherit;
            border-radius: inherit;
        }

        .bg-inner-card {
            background: #111118;
        }

        /* Custom scrollbar - cyan themed */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #06b6d4;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #22d3ee;
        }

        /* Glow effect */
        .glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
        }
        .glow-lime {
            box-shadow: 0 0 20px rgba(132, 204, 22, 0.15);
        }

        /* Range slider styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #1e1e2e;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #84cc16);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }

        /* Checkbox styling */
        input[type="checkbox"] {
            accent-color: #06b6d4;
        }
    </style>
